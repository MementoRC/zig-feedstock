name: zig win cross selftest
on:
  push:
    branches: [scratch/zig-win-cross-selftest]
  workflow_dispatch:
env:
  ZV: 0.18.0-dev.828+9da287565
jobs:
  cross:
    name: build no-LLVM zig.exe on ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-latest
          - host: osx
            os: macos-14
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: zenv
          init-shell: bash
          create-args: >-
            -c conda-forge/label/zig_dev -c conda-forge
            zig=0.18.0=*_8281
      - name: cross-build zig for x86_64-windows-gnu (no LLVM)
        run: |
          micromamba list zig
          curl -fsSL -o src.tar.xz "https://ziglang.org/builds/zig-$ZV.tar.xz"
          mkdir src
          tar -xf src.tar.xz -C src --strip-components=1
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zgc" ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zlc"
          cd src
          sed -i.bak 's/8_000_000_000/7_000_000_000/g' build.zig
          time zig build -Dtarget=x86_64-windows-gnu -Denable-llvm=false -Doptimize=ReleaseSafe \
            -Dno-langref -Dversion-string="$ZV" --prefix "$GITHUB_WORKSPACE/win"
          file "$GITHUB_WORKSPACE/win/bin/zig.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: zig-win-from-${{ matrix.host }}
          path: win
  native:
    name: build no-LLVM zig.exe natively on windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: build with the official zig.exe
        run: |
          curl -fsSL -o z.zip "https://ziglang.org/builds/zig-x86_64-windows-$ZV.zip"
          7z x -y z.zip > /dev/null
          curl -fsSL -o src.tar.xz "https://ziglang.org/builds/zig-$ZV.tar.xz"
          mkdir src
          tar -xf src.tar.xz -C src --strip-components=1
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zgc" ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zlc"
          ZO="$PWD/zig-x86_64-windows-$ZV/zig.exe"
          cd src
          time "$ZO" build -Denable-llvm=false -Doptimize=ReleaseSafe \
            -Dno-langref -Dversion-string="$ZV" --prefix "$GITHUB_WORKSPACE/win"
          ls -la "$GITHUB_WORKSPACE/win/bin"
      - uses: actions/upload-artifact@v4
        with:
          name: zig-win-from-native
          path: win
  bootstrap:
    name: zig-bootstrap LLVM cross on ${{ matrix.host }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: osx
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: tools
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ninja cmake || true; else sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build cmake; fi
      - name: clone zig-bootstrap
        run: |
          git clone --depth 1 https://codeberg.org/ziglang/zig-bootstrap.git zb || git clone --depth 1 https://github.com/ziglang/zig-bootstrap.git zb
          cd zb && git log -1 --format='zig-bootstrap %H %cd' && grep -m1 -i 'version' zig/build.zig.zon || true
      - name: build x86_64-windows-gnu
        run: |
          cd zb
          rc=0
          time ./build x86_64-windows-gnu baseline > "$RUNNER_TEMP/zb.log" 2>&1 || rc=$?
          tail -n 150 "$RUNNER_TEMP/zb.log"
          grep -n -i -E 'error|FAILED' "$RUNNER_TEMP/zb.log" | tail -n 60 || true
          ls -la out || true
          exit $rc
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zb-log
          path: ${{ runner.temp }}/zb.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: zig-win-from-bootstrap-${{ matrix.host }}
          path: zb/out/zig-x86_64-windows-gnu-baseline
  wintest:
    name: run zig.exe (${{ matrix.src }}) on windows
    needs: [cross, native]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        src: [linux, osx, native, official]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - if: matrix.src != 'official'
        uses: actions/download-artifact@v4
        with:
          name: zig-win-from-${{ matrix.src }}
          path: win
      - if: matrix.src == 'official'
        run: |
          curl -fsSL -o z.zip "https://ziglang.org/builds/zig-x86_64-windows-$ZV.zip"
          7z x -y z.zip > /dev/null
          mv "zig-x86_64-windows-$ZV" win
      - name: version, env, hello
        run: |
          ZE=$(ls "$PWD"/win/bin/zig.exe "$PWD"/win/zig.exe 2>/dev/null | head -n 1 || true)
          "$ZE" version
          "$ZE" env
          printf 'const std = @import("std");\npub fn main() void {\n    std.debug.print("hello from {s} zig.exe\\n", .{"${{ matrix.src }}"});\n}\n' > hello.zig
          printf '#include <stdio.h>\nint main(void) { puts("hello from C via ${{ matrix.src }} zig cc"); return 0; }\n' > hello.c
          set +e
          "$ZE" build-exe -target x86_64-windows -fno-llvm -fno-lld -femit-bin=hello_win.exe hello.zig
          rcw=$?
          echo "build-exe x86_64-windows (self-hosted) rc=$rcw"
          [ -f hello_win.exe ] && ./hello_win.exe
          "$ZE" build-exe -target x86_64-linux -fno-llvm -fno-lld -femit-bin=hello_lnx hello.zig
          echo "build-exe x86_64-linux (self-hosted) rc=$?"
          "$ZE" cc -target x86_64-windows-gnu -o hello_c.exe hello.c
          echo "zig cc x86_64-windows-gnu rc=$?"
          [ -f hello_c.exe ] && ./hello_c.exe
          exit $rcw
  wintest-bootstrap:
    name: run zig.exe (bootstrap-${{ matrix.host }}) on windows
    needs: bootstrap
    if: always()
    strategy:
      fail-fast: false
      matrix:
        host: [osx]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zig-win-from-bootstrap-${{ matrix.host }}
          path: win
      - name: version, hello (LLVM), zig cc
        run: |
          ZE=$(ls "$PWD"/win/bin/zig.exe "$PWD"/win/zig.exe 2>/dev/null | head -n 1 || true)
          "$ZE" version
          printf 'const std = @import("std");\npub fn main() void {\n    std.debug.print("hello from bootstrap {s} zig.exe\\n", .{"${{ matrix.host }}"});\n}\n' > hello.zig
          printf '#include <stdio.h>\nint main(void) { puts("hello from C via bootstrap ${{ matrix.host }} zig cc"); return 0; }\n' > hello.c
          set +e
          "$ZE" build-exe -target x86_64-windows -femit-bin=hello_win.exe hello.zig
          rcw=$?
          echo "build-exe x86_64-windows (LLVM) rc=$rcw"
          [ -f hello_win.exe ] && ./hello_win.exe
          "$ZE" cc -target x86_64-windows-gnu -o hello_c.exe hello.c
          rcc=$?
          echo "zig cc x86_64-windows-gnu rc=$rcc"
          [ -f hello_c.exe ] && ./hello_c.exe
          exit $(( rcw | rcc ))
  msvc-xwin:
    name: build LLVM zig.exe for windows-msvc on linux (xwin)
    timeout-minutes: 150
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: feedstock
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: zenv
          init-shell: bash
          create-args: >-
            -c conda-forge/label/zig_dev -c conda-forge
            zig=0.18.0=*_8281
      - name: fetch xwin and splat the MSVC CRT and SDK
        run: |
          set +e
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" -o rel.json https://api.github.com/repos/Jake-Shadle/xwin/releases/latest
          echo "release api rc=$?"
          grep -m1 '"tag_name"' rel.json
          URL=$(grep -o 'https://[^"]*x86_64-unknown-linux-musl\.tar\.gz' rel.json | head -n 1)
          echo "asset: $URL"
          mkdir xwin-dl
          curl -fsSL "$URL" | tar -xz -C xwin-dl --strip-components=1
          echo "extract rc=$?"
          find xwin-dl -type f
          XW=$(find "$PWD/xwin-dl" -type f -name xwin | head -n 1)
          "$XW" --version
          rc=0
          "$XW" --accept-license splat --output "$RUNNER_TEMP/xwin" || rc=$?
          echo "xwin splat rc=$rc"
          find "$RUNNER_TEMP/xwin" -maxdepth 4 -type d | sort | head -80
          exit $rc
      - name: create win-64 LLVM prefix without running it
        run: |
          set +e
          rc=0
          micromamba create -y -p "$RUNNER_TEMP/winpfx" --platform win-64 -c conda-forge "llvmdev=23.1" "clangdev=23.1" "lld=23.1" zstd zlib libxml2 libxml2-devel || rc=$?
          echo "create rc=$rc"
          if [ "$rc" -ne 0 ]; then
            micromamba search --platform win-64 -c conda-forge 'clangdev=23*' | tail -n 20
            micromamba search --platform win-64 -c conda-forge 'lld=23*' | tail -n 20
            rc=0
            micromamba create -y -p "$RUNNER_TEMP/winpfx" --platform win-64 -c conda-forge "llvmdev=23" "clangdev=23" "lld=23" zstd zlib libxml2 libxml2-devel || rc=$?
            echo "retry create rc=$rc"
          fi
          ls "$RUNNER_TEMP/winpfx/Library/lib" | grep -i -E '^(LLVM-C|lld|zstd|z|zlib|xml|libxml|iconv|libiconv|charset|libcharset|lzma|liblzma)' | sort
          ls "$RUNNER_TEMP/winpfx/Library/bin" | grep -i -E '\.dll$' | grep -i -E 'xml|zstd|zlib|iconv|charset|lzma|icu' | sort
          grep -E 'LLVM_VERSION|LLVM_DEFAULT_TARGET' "$RUNNER_TEMP/winpfx/Library/include/llvm/Config/llvm-config.h"
          exit $rc
      - name: fetch zig source and inspect msvc handling
        run: |
          set +e
          micromamba list zig
          curl -fsSL -o src.tar.xz "https://ziglang.org/builds/zig-$ZV.tar.xz"
          mkdir src
          tar -xf src.tar.xz -C src --strip-components=1
          cd src
          sed -i.bak 's/8_000_000_000/7_000_000_000/g' build.zig
          grep -n 'exe.stack_size = stack_size;' build.zig
          sed -i 's/^\( *\)exe\.stack_size = stack_size;$/&\n\1if (exe.rootModuleTarget().os.tag == .windows and exe.rootModuleTarget().abi == .msvc) exe.linkage = .dynamic;/' build.zig
          echo "dynamic-crt lines: $(grep -c 'exe.linkage = .dynamic' build.zig)"
          grep -n -B1 'exe.linkage = .dynamic' build.zig
          grep -n '"-std=c++17",' build.zig
          sed -i 's/"-std=c++17",/"-std=c++17", "-fms-runtime-lib=dll",/' build.zig
          echo "ms-runtime-lib lines: $(grep -c 'fms-runtime-lib=dll' build.zig)"
          grep -n 'fms-runtime-lib=dll' build.zig
          grep -n -B2 -A2 '"zstd"' build.zig
          sed -i 's/^\(.*\)linkSystemLibrary("zstd"\(.*\)$/&\n\1linkSystemLibrary("libxml2"\2/' build.zig
          echo "libxml2 link lines: $(grep -c 'linkSystemLibrary("libxml2"' build.zig)"
          grep -n -B1 -A1 'linkSystemLibrary("libxml2"' build.zig
          grep -n -E 'include_dir|sys_include_dir|crt_dir|msvc_lib_dir|kernel32_lib_dir|cc_dir|may not be empty|must be empty' lib/std/zig/LibCInstallation.zig | head -60
          grep -n -i -E 'msvc|link_libcpp|linkLibCpp|static.llvm|search.prefix|config_h' build.zig | head -80
          exit 0
      - name: write libc file
        run: |
          X="$RUNNER_TEMP/xwin"
          printf 'include_dir=%s/sdk/include/ucrt\nsys_include_dir=%s/crt/include\ncrt_dir=%s/sdk/lib/ucrt/x86_64\nmsvc_lib_dir=%s/crt/lib/x86_64\nkernel32_lib_dir=%s/sdk/lib/um/x86_64\ngcc_dir=\ndarwin_sdk_dir=\ncc_dir=/usr/lib/x86_64-linux-gnu\n' "$X" "$X" "$X" "$X" "$X" > "$RUNNER_TEMP/libc-msvc.txt"
          cat "$RUNNER_TEMP/libc-msvc.txt"
      - name: build LLVM zig.exe for x86_64-windows-msvc
        run: |
          set +e
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zgc" ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zlc"
          cd src
          rc=0
          time zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseSafe -Denable-llvm -Dstatic-llvm \
            --search-prefix "$RUNNER_TEMP/winpfx/Library" --libc "$RUNNER_TEMP/libc-msvc.txt" \
            -Dversion-string="$ZV" --prefix "$RUNNER_TEMP/zig-out" > "$RUNNER_TEMP/msvc-build.log" 2>&1 || rc=$?
          echo "build rc=$rc"
          echo "BUILD_RC=$rc" >> "$GITHUB_ENV"
          tail -n 150 "$RUNNER_TEMP/msvc-build.log"
          grep -n -i -E 'error|undefined|unresolved|lld-link' "$RUNNER_TEMP/msvc-build.log" | head -80
          exit 0
      - name: inspect zig.exe
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/zig-out/bin/zig.exe" ]; then
            for d in "$RUNNER_TEMP"/winpfx/Library/bin/*.dll; do case "$(basename "$d" | tr 'A-Z' 'a-z')" in *xml*|*zstd*|*zlib*|*iconv*|*charset*|*lzma*|icu*) cp -v "$d" "$RUNNER_TEMP/zig-out/bin/";; esac; done
            sudo apt-get install -y -qq llvm
            llvm-readobj --coff-imports "$RUNNER_TEMP/zig-out/bin/zig.exe" | grep -i 'Name:' | sort -u
            ls -la "$RUNNER_TEMP/zig-out/bin"
          else
            echo "no zig.exe produced"
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: zig-win-msvc-xwin
          path: ${{ runner.temp }}/zig-out
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-build-log
          path: ${{ runner.temp }}/msvc-build.log
          if-no-files-found: ignore
      - name: exit with build rc
        run: exit "${BUILD_RC:-1}"
  wintest-msvc:
    name: run zig.exe (msvc-xwin) on windows
    needs: msvc-xwin
    if: always()
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zig-win-msvc-xwin
          path: win
      - name: version, env, hello (LLVM), zig cc
        run: |
          ZE=$(ls "$PWD"/win/bin/zig.exe "$PWD"/win/zig.exe 2>/dev/null | head -n 1 || true)
          "$ZE" version
          "$ZE" env
          printf 'const std = @import("std");\npub fn main() void {\n    std.debug.print("hello from msvc-xwin zig.exe\\n", .{});\n}\n' > hello.zig
          printf '#include <stdio.h>\nint main(void) { puts("hello from C via msvc-xwin zig cc"); return 0; }\n' > hello.c
          set +e
          "$ZE" build-exe -target x86_64-windows -femit-bin=hello_win.exe hello.zig
          rcw=$?
          echo "build-exe x86_64-windows (LLVM) rc=$rcw"
          [ -f hello_win.exe ] && ./hello_win.exe
          "$ZE" build-exe -target x86_64-linux -femit-bin=hello_lnx hello.zig
          echo "build-exe x86_64-linux (LLVM) rc=$?"
          "$ZE" cc -target x86_64-windows-gnu -o hello_c.exe hello.c
          echo "zig cc x86_64-windows-gnu rc=$?"
          [ -f hello_c.exe ] && ./hello_c.exe
          "$ZE" cc -target x86_64-windows-msvc -o hello_m.exe hello.c
          echo "zig cc x86_64-windows-msvc rc=$?"
          [ -f hello_m.exe ] && ./hello_m.exe
          exit $rcw
