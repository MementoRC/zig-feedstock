name: zig windows msvc from linux
on:
  push:
    branches: [scratch/zig-win-msvc-linux]
  workflow_dispatch:
env:
  ZV: 0.18.0-dev.935+ead8f5a7a
  ZB: "9301"
jobs:
  build:
    name: zig.exe ${{ matrix.ztarget }} on ${{ matrix.zigimpl }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04-arm
            zigimpl: linux-aarch64
            ztarget: x86_64-windows-msvc
            winplat: win-64
            cwa: published
          - arch: arm64
            runner: ubuntu-24.04
            zigimpl: linux-64
            ztarget: aarch64-windows-msvc
            winplat: win-arm64
            cwa: pr78
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      CONDA_BUILD_WINSDK: /tmp/cf-ci-winsdk
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: feedstock
      - uses: actions/checkout@v4
        if: matrix.cwa == 'pr78'
        with:
          repository: MementoRC/clang-win-activation-feedstock
          ref: win-arm64-cross-libs
          path: cwa
      - run: mkdir -p "$CONDA_BUILD_WINSDK"
        shell: bash
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: zenv
          init-shell: bash
          create-args: >-
            -c conda-forge/label/zig_dev -c conda-forge
            zig=0.18.0=*_${{ env.ZB }}
            zig_impl_${{ matrix.zigimpl }}=0.18.0=*_${{ env.ZB }}
            llvm-tools=23
            ${{ matrix.cwa == 'published' && 'winsdk msvc-headers-libs' || '' }}
      - name: add the PR 76 OnecoreUap extraction to the published winsdk activation
        if: matrix.cwa == 'published'
        # plain bash: a login shell would activate zenv and download the SDK before the edit
        shell: bash
        run: |
          E="$MAMBA_ROOT_PREFIX/envs/zenv"
          ls "$E/etc/conda/activate.d"
          for f in "$E"/etc/conda/activate.d/*winsdk*.sh; do
            sed -i '/Windows SDK for Windows Store Apps Headers-x86_en-us.msi/{p;s/Store Apps Headers-x86_en-us.msi/Store Apps Headers OnecoreUap-x86_en-us.msi/}' "$f"
            grep -n 'msiextract' "$f"
          done
      - name: build clang-win-activation PR 78 with the PR 76 line and the unix-to-win-arm64 skip lifted
        if: matrix.cwa == 'pr78'
        run: |
          set -x
          cd cwa
          git log -1 --oneline
          sed -i '/cross_target_platform == "win-arm64") and target_platform != cross_target_platform/d' recipe/recipe.yaml
          grep -n 'skip' recipe/recipe.yaml
          sed -i '/Windows SDK for Windows Store Apps Headers-x86_en-us.msi/{p;s/Store Apps Headers-x86_en-us.msi/Store Apps Headers OnecoreUap-x86_en-us.msi/}' recipe/activate-winsdk.sh
          grep -n 'msiextract' recipe/activate-winsdk.sh
          V=$(ls .ci_support/linux_64_CLANG_VERSION23.1MSVC_HEADERS_VERSION14.44*win-64.yaml | head -n 1)
          sed 's/win-64/win-arm64/' "$V" > "$RUNNER_TEMP/variant.yaml"
          cat "$RUNNER_TEMP/variant.yaml"
          micromamba create -y -n rb -c conda-forge rattler-build
          micromamba run -n rb rattler-build build -r recipe -m "$RUNNER_TEMP/variant.yaml" --test skip --output-dir "$RUNNER_TEMP/cwa-out"
          find "$RUNNER_TEMP/cwa-out" -name '*.conda' | sort
          names=$(find "$RUNNER_TEMP/cwa-out" -name '*.conda' -exec basename {} \; | grep -E '^(winsdk|msvc-headers-libs)' | sed -E 's/-[^-]+-[^-]+\.conda$//' | sort -u)
          echo "installing: $names"
          micromamba install -y -n zenv -c "file://$RUNNER_TEMP/cwa-out" -c conda-forge $names
      - name: msvc activation state and libc file
        run: |
          set +e
          micromamba list | grep -i -E 'zig|msvc|winsdk'
          ls "$CONDA_PREFIX/etc/conda/activate.d"
          find "$CONDA_BUILD_WINSDK" -maxdepth 3 -type d | sort | head -n 60
          S=$(ls -d "$CONDA_BUILD_WINSDK"/winsdk-* | tail -n 1)
          M=$(ls -d "$CONDA_BUILD_WINSDK"/msvc-* | tail -n 1)
          ls -la "$S/include/shared/winapifamily.h" "$S/include/shared/basetsd.h"
          ls "$S/lib/um" "$S/lib/ucrt" "$M/lib"
          sed -e 's#/x64$#/${{ matrix.arch }}#' -e 's#libc-x86_64-windows-msvc#libc-${{ matrix.ztarget }}#' feedstock/recipe/scripts/zig_msvc_libc.sh > "$RUNNER_TEMP/zml.sh"
          source "$RUNNER_TEMP/zml.sh"
          cp "$ZIG_MSVC_LIBC_FILE" "$RUNNER_TEMP/libc-msvc.txt"
          cat "$RUNNER_TEMP/libc-msvc.txt"
          echo "extra includes: $ZIG_MSVC_EXTRA_INCLUDES"
          test -f "$S/include/shared/winapifamily.h" && test -d "$S/lib/um/${{ matrix.arch }}" && test -d "$M/lib/${{ matrix.arch }}"
      - name: create ${{ matrix.winplat }} LLVM prefix without running it
        run: |
          set +e
          rc=0
          micromamba create -y -p "$RUNNER_TEMP/winpfx" --platform ${{ matrix.winplat }} -c conda-forge \
            "llvmdev=23.1" "clangdev=23.1" "libclang-cpp=23.1" "lld=23.1" zstd zlib libxml2 libxml2-devel || rc=$?
          echo "create rc=$rc"
          grep -E 'LLVM_VERSION|LLVM_DEFAULT_TARGET' "$RUNNER_TEMP/winpfx/Library/include/llvm/Config/llvm-config.h"
          exit $rc
      - name: fetch zig source and apply recipe patches
        run: |
          curl -fsSL -o src.tar.xz "https://ziglang.org/builds/zig-$ZV.tar.xz"
          mkdir src
          tar -xf src.tar.xz -C src --strip-components=1
          P="$GITHUB_WORKSPACE/feedstock/recipe/patches"
          cd src
          for p in \
            Lld.zig-macho-lld-support.patch \
            Lld.zig-glibc-libs-honour-no-as-needed.patch \
            llvm.zig-lld-ofmt-macho.patch \
            Config.zig-macho-no-auto-lld.patch \
            main.zig-fuse-ld-lld-cc-path.patch \
            build.zig-02-doctest-forward-target.patch \
            build.zig-03-compiler-step-zig-lib-dir.patch \
            libcxx.zig-darwin-typeinfo-comparison.patch \
            non_unix/mingw.zig-01-include-setjmp-s.patch \
            non_unix/mingw-setjmp-no-crtimp.patch \
            non_unix/mingw.zig-02-arm64-stubs.patch \
            posix.zig-dl-iterate-phdr-no-pt-phdr.patch \
            x86.zig-hyphenate-llvm-names.patch \
            Lld.zig-mingw-export-all-symbols.patch \
            non_unix/build.zig-01-maxrss.patch \
            non_unix/build.zig-02-llvm-lib-multipath.patch \
            non_unix/build.zig-03-msvc-crt-dynamic.patch \
            non_unix/CMakeLists.txt-01-correct-LLVM_LIBRARIES.patch \
            non_unix/Lld.zig-remove-ucrt.patch \
            non_unix/Lld.zig-suppress-importeddllmain.patch \
            non_unix/CMakeLists.txt-02-MD-libzigcpp.patch \
            non_unix/floatop.zig-log2-vectors-approx.patch \
            non_unix/mingw-crtexe-no-atexit.patch \
            non_unix/DepTokenizer.zig-rhs-leading-backslash-prereq.patch \
            non_unix/ucrtbase-export-atexit-alias.patch \
            non_unix/selfinfo-windows-arm64-ptrcast-aligncast.patch \
            non_unix/gccmain-do-global-ctors-guard.patch \
            non_unix/Compilation.zig-msvc-no-libcxxabi.patch
          do
            echo "== $p"
            patch -p1 --forward --no-backup-if-mismatch -i "$P/$p"
          done
          grep -q 'fms-runtime-lib=dll' build.zig || sed -i 's/"-std=c++17",/"-std=c++17", "-fms-runtime-lib=dll",/' build.zig
          # zig always passes -nostdinc++; the msvc toolchain never claims it
          sed -i 's/"-std=c++17",/"-std=c++17", "-Wno-unused-command-line-argument",/' build.zig
          sed -i 's/^\(.*\)linkSystemLibrary("zstd"\(.*\)$/&\n\1linkSystemLibrary("libxml2"\2/' build.zig
          # zig build --libc also reaches the host configurer; scope it to the zig exe only.
          sed -i 's|^\( *\)exe\.stack_size = stack_size;$|&\n\1if (exe.rootModuleTarget().os.tag == .windows) exe.setLibCFile(.{ .cwd_relative = "LIBC_MSVC_TXT" });|' build.zig
          sed -i "s|LIBC_MSVC_TXT|$RUNNER_TEMP/libc-msvc.txt|" build.zig
          echo "setLibCFile: $(grep -c 'setLibCFile' build.zig)"
          grep -n -B1 'setLibCFile' build.zig
          echo "dynamic-crt: $(grep -c 'linkage = .dynamic' build.zig) ms-runtime-lib: $(grep -c 'fms-runtime-lib=dll' build.zig) no-unused: $(grep -c 'Wno-unused-command-line-argument' build.zig) libxml2: $(grep -c 'linkSystemLibrary("libxml2"' build.zig)"
      - name: case aliases for mixed-case SDK includes
        run: |
          S=$(ls -d "$CONDA_BUILD_WINSDK"/winsdk-* | tail -n 1)
          M=$(ls -d "$CONDA_BUILD_WINSDK"/msvc-* | tail -n 1)
          python3 -I - "$S/include/ucrt" "$S/include/um" "$S/include/shared" "$S/include/winrt" "$M/include" -- "$RUNNER_TEMP/winpfx/Library/include" "$GITHUB_WORKSPACE/src/src" <<'EOF'
          import os, re, sys
          a = sys.argv[1:]
          k = a.index("--")
          dirs = [d for d in a[:k] if os.path.isdir(d)]
          srcs = dirs + [d for d in a[k + 1:] if os.path.isdir(d)]
          inc = re.compile(rb'^\s*#\s*include\s*[<"]([^>"]+)[>"]', re.M)
          lower = {}
          for d in dirs:
              for root, _, files in os.walk(d):
                  for f in files:
                      rel = os.path.relpath(os.path.join(root, f), d)
                      lower.setdefault((d, rel.lower()), rel)
          names = set()
          for d in srcs:
              for root, _, files in os.walk(d):
                  for f in files:
                      try:
                          data = open(os.path.join(root, f), "rb").read()
                      except OSError:
                          continue
                      for m in inc.finditer(data):
                          names.add(m.group(1).decode("latin-1").replace("\\", "/"))
          made = 0
          for n in sorted(names):
              if n.startswith(("/", "..")) or any(os.path.lexists(os.path.join(d, n)) for d in dirs):
                  continue
              for d in dirs:
                  real = lower.get((d, n.lower()))
                  if real:
                      dst = os.path.join(d, n)
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      os.symlink(os.path.relpath(os.path.join(d, real), os.path.dirname(dst)), dst)
                      made += 1
                      break
          print("case aliases created:", made)
          for n in ("DriverSpecs.h", "winapifamily.h", "Windows.h", "windows.h"):
              print(n, [d for d in dirs if os.path.lexists(os.path.join(d, n))])
          EOF
      - name: build LLVM zig.exe for ${{ matrix.ztarget }}
        run: |
          set +e
          which zig
          zig version
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zgc" ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zlc"
          cd src
          rc=0
          time zig build -Dtarget=${{ matrix.ztarget }} -Dcpu=baseline -Doptimize=ReleaseSafe \
            -Denable-llvm -Dstatic-llvm -Dno-langref \
            --search-prefix "$RUNNER_TEMP/winpfx/Library" \
            -Dversion-string="$ZV" --prefix "$RUNNER_TEMP/zig-out" > "$RUNNER_TEMP/msvc-build.log" 2>&1 || rc=$?
          echo "build rc=$rc"
          echo "BUILD_RC=$rc" >> "$GITHUB_ENV"
          tail -n 150 "$RUNNER_TEMP/msvc-build.log"
          grep -n -i -E 'error|undefined|unresolved|lld-link' "$RUNNER_TEMP/msvc-build.log" | head -80
          exit 0
      - name: inspect zig.exe, ship runtime DLLs
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/zig-out/bin/zig.exe" ]; then
            for d in "$RUNNER_TEMP"/winpfx/Library/bin/*.dll; do case "$(basename "$d" | tr 'A-Z' 'a-z')" in *xml*|*zstd*|*zlib*|*iconv*|*charset*|*lzma*|icu*) cp -v "$d" "$RUNNER_TEMP/zig-out/bin/";; esac; done
            llvm-readobj --file-headers "$RUNNER_TEMP/zig-out/bin/zig.exe" | grep -i -E 'machine|format'
            llvm-readobj --coff-imports "$RUNNER_TEMP/zig-out/bin/zig.exe" | grep -i 'Name:' | sort -u
            ls -la "$RUNNER_TEMP/zig-out/bin"
            du -sh "$RUNNER_TEMP/zig-out/lib/zig"
          else
            echo "no zig.exe produced"
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: zig-msvc-${{ matrix.arch }}
          path: ${{ runner.temp }}/zig-out
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-build-log-${{ matrix.arch }}
          path: ${{ runner.temp }}/msvc-build.log
          if-no-files-found: ignore
      - name: exit with build rc
        run: exit "${BUILD_RC:-1}"
        shell: bash
  wintest:
    name: run ${{ matrix.arch }} zig.exe on ${{ matrix.runner }}
    needs: build
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            zt: x86_64
          - arch: arm64
            runner: windows-11-arm
            zt: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zig-msvc-${{ matrix.arch }}
          path: win
      - name: version, env, zig + C + C++ hellos
        run: |
          ZE="$PWD/win/bin/zig.exe"
          ZT=${{ matrix.zt }}
          "$ZE" version
          "$ZE" env
          printf 'const std = @import("std");\npub fn main() void {\n    std.debug.print("hello from linux-built zig.exe\\n", .{});\n}\n' > hello.zig
          printf '#include <stdio.h>\nint main(void) { puts("hello from C"); return 0; }\n' > hello.c
          printf '#include <iostream>\n#include <string>\nint main() { std::string s = "hello from C++"; std::cout << s << std::endl; return 0; }\n' > hello.cpp
          fail=0
          t() { local n="$1"; shift; echo "== $n"; if "$@"; then echo "PASS $n"; else echo "FAIL $n rc=$?"; fail=1; fi; }
          t zig-win      "$ZE" build-exe -target $ZT-windows -femit-bin=hello_win.exe hello.zig
          t zig-win-run  ./hello_win.exe
          t zig-linux    "$ZE" build-exe -target $ZT-linux -femit-bin=hello_lnx hello.zig
          t cc-gnu       "$ZE" cc -target $ZT-windows-gnu -mconsole -o c_gnu.exe hello.c
          t cc-gnu-run   ./c_gnu.exe
          t cc-msvc      "$ZE" cc -target $ZT-windows-msvc -o c_msvc.exe hello.c
          t cc-msvc-run  ./c_msvc.exe
          t cxx-gnu      "$ZE" c++ -target $ZT-windows-gnu -o cxx_gnu.exe hello.cpp
          t cxx-gnu-run  ./cxx_gnu.exe
          t cxx-msvc     "$ZE" c++ -target $ZT-windows-msvc -o cxx_msvc.exe hello.cpp
          t cxx-msvc-run ./cxx_msvc.exe
          t zig-test     "$ZE" test hello.zig
          exit $fail
