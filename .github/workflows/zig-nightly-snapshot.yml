name: Zig nightly snapshot check

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      relevancy_platforms:
        description: 'Space-separated target_platform values to run check_patch_relevancy.sh against'
        type: string
        default: 'linux-64 linux-aarch64 linux-ppc64le linux-riscv64 linux-s390x osx-64 osx-arm64 win-64 win-32 win-arm64'

permissions:
  contents: read

env:
  RELEVANCY_PLATFORMS: ${{ inputs.relevancy_platforms || 'linux-64 linux-aarch64 linux-ppc64le linux-riscv64 linux-s390x osx-64 osx-arm64 win-64 win-32 win-arm64' }}

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: dev
            channel: master
          # experimental disabled for now; uncomment to re-enable
          # - branch: experimental
          #   channel: release
    steps:
      - name: Checkout this repo (for the bump script)
        uses: actions/checkout@v7

      - name: Checkout conda-forge/zig-feedstock@${{ matrix.branch }}
        uses: actions/checkout@v7
        with:
          repository: conda-forge/zig-feedstock
          ref: ${{ matrix.branch }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check for a new zig ${{ matrix.channel }} version
        id: bump
        run: python3 .github/scripts/bump_snapshot.py upstream/recipe/recipe.yaml --channel ${{ matrix.channel }}

      - name: Install relevancy gate dependencies
        if: steps.bump.outputs.changed == 'true'
        run: pip install pyyaml

      - name: Run patch-relevancy gate
        if: steps.bump.outputs.changed == 'true'
        id: relevancy
        working-directory: upstream
        run: |
          set +e
          out="$RUNNER_TEMP/relevancy"
          body="$RUNNER_TEMP/pr_body.md"
          mkdir -p "$out"
          : > "$out/summary.md"
          : > "$out/details.md"
          for p in $RELEVANCY_PLATFORMS; do
            bash ../.github/scripts/check_patch_relevancy.sh "$p" > "$out/$p.txt" 2>&1
            rc=$?
            awk -v p="$p" -v rc="$rc" '
              /^patch count/ { n = $4 }
              /^CLEAN: / { split($2, a, "/"); c = a[1] }
              /^RESULT:/ { res = $2 }
              $1 ~ /\.patch$/ && $2 ~ /^(CLEAN|OFFSET|FUZZ|DRIFT|FAIL|OBSOLETE|HIGHFUZZ)/ {
                st = $2; sub(/\(.*/, "", st); cnt[st]++
                m = split($1, b, "/"); name = b[m]; sub(/\.patch$/, "", name)
                v = -1
                if (st == "OFFSET") { v = $2; gsub(/[^0-9]/, "", v); v = v + 0 }
                else if (match($0, /offset=[0-9]+/)) { v = substr($0, RSTART + 7, RLENGTH - 7) + 0 }
                if (v + 0 > mx + 0 || (v >= 0 && mx == "")) { mx = v; mxname = name }
                if (st ~ /^(FAIL|DRIFT|OBSOLETE|HIGHFUZZ)$/) {
                  lst[st] = lst[st] (lst[st] == "" ? "" : ", ") name
                }
              }
              END {
                if (n == "" || res == "") {
                  printf "- %s: UNPARSEABLE output (rc=%s); see full audit below\n", p, rc
                  exit
                }
                line = sprintf("- %s: %s - %d patches (%d clean, %d offset", p, res, n, c, cnt["OFFSET"])
                if (cnt["FUZZ"] + cnt["HIGHFUZZ"] > 0) line = line sprintf(", %d fuzz", cnt["FUZZ"] + cnt["HIGHFUZZ"])
                if (cnt["FAIL"] > 0) line = line sprintf(", %d fail", cnt["FAIL"])
                if (cnt["DRIFT"] > 0) line = line sprintf(", %d drift", cnt["DRIFT"])
                if (cnt["OBSOLETE"] > 0) line = line sprintf(", %d obsolete", cnt["OBSOLETE"])
                if (mxname != "") line = line sprintf("); max OFFSET %d %s", mx + 0, mxname)
                else line = line ")"
                print line
                split("FAIL DRIFT OBSOLETE HIGHFUZZ", ks, " ")
                for (i = 1; i <= 4; i++) if (lst[ks[i]] != "") printf "  - %s: %s\n", ks[i], lst[ks[i]]
              }
            ' "$out/$p.txt" >> "$out/summary.md"
            {
              echo "<details><summary>$p full audit</summary>"
              echo
              echo '```'
              cat "$out/$p.txt"
              echo '```'
              echo
              echo '</details>'
              echo
            } >> "$out/details.md"
          done
          cat > "$body" <<'BODY_EOF_7f3a91'
          Automated zig ${{ matrix.channel }} version bump.

          - version: ${{ steps.bump.outputs.old_version }} -> ${{ steps.bump.outputs.new_version }}
          - build_number: ${{ steps.bump.outputs.old_build_number }} -> ${{ steps.bump.outputs.new_build_number }}
          - tarball: ${{ steps.bump.outputs.tarball_url }}
          - sha256: ${{ steps.bump.outputs.sha256 }}
          - bootstrap sha256s patched: ${{ steps.bump.outputs.bootstrap_patched }}

          Patch relevancy gate:
          BODY_EOF_7f3a91
          {
            cat "$out/summary.md"
            echo
            cat "$out/details.md"
            echo "Auto-generated by MementoRC/zig-feedstock's .github/workflows/zig-nightly-snapshot.yml -- verify FAIL/DRIFT/large-OFFSET findings above before merging. Diff is scoped to recipe/recipe.yaml only."
          } >> "$body"
          echo "body_file=$body" >> "$GITHUB_OUTPUT"

      - name: Push bump branch to fork and open PR to conda-forge:${{ matrix.branch }}
        if: steps.bump.outputs.changed == 'true'
        working-directory: upstream
        env:
          GH_TOKEN: ${{ secrets.CF_ZIG_PAT }}
        run: |
          git config user.name "zig-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="snapshot/${{ matrix.branch }}-${{ steps.bump.outputs.new_id }}"
          git checkout -b "$BRANCH"
          git commit -am "zig ${{ matrix.channel }}: bump ${{ steps.bump.outputs.old_id }} -> ${{ steps.bump.outputs.new_id }}"
          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/MementoRC/zig-feedstock.git"
          git push fork "$BRANCH"
          gh pr create \
            --repo conda-forge/zig-feedstock \
            --base "${{ matrix.branch }}" \
            --head "MementoRC:${BRANCH}" \
            --title "[${{ matrix.branch }}] version bump: ${{ steps.bump.outputs.old_id }} -> ${{ steps.bump.outputs.new_id }}" \
            --body-file "${{ steps.relevancy.outputs.body_file }}"
