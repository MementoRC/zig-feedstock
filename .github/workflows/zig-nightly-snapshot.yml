name: Zig nightly snapshot check

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      relevancy_platforms:
        description: 'Space-separated target_platform values to run check_patch_relevancy.sh against'
        type: string
        default: 'linux-64 win-64'
      dry_run:
        description: 'Run bump and checks but skip the push/PR; show the would-be title and body in the job summary'
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEVANCY_PLATFORMS: ${{ inputs.relevancy_platforms || 'linux-64 win-64' }}

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: dev
            channel: master
          # experimental disabled for now; uncomment to re-enable
          # - branch: experimental
          #   channel: release
    steps:
      - name: Checkout this repo (for the bump script)
        uses: actions/checkout@v7

      - name: Checkout conda-forge/zig-feedstock@${{ matrix.branch }}
        uses: actions/checkout@v7
        with:
          repository: conda-forge/zig-feedstock
          ref: ${{ matrix.branch }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check for a new zig ${{ matrix.channel }} version
        id: bump
        run: python3 .github/scripts/bump_snapshot.py upstream/recipe/recipe.yaml --channel ${{ matrix.channel }}

      - name: Install relevancy gate dependencies
        if: steps.bump.outputs.changed == 'true'
        run: pip install pyyaml

      - name: Run patch-relevancy gate
        if: steps.bump.outputs.changed == 'true'
        id: relevancy
        working-directory: upstream
        run: |
          set +e
          {
            echo 'relevancy<<EOF'
            for p in $RELEVANCY_PLATFORMS; do
              echo "### $p"
              bash ../.github/scripts/check_patch_relevancy.sh "$p"
              echo
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Probe pinned bootstrap against the new snapshot
        if: steps.bump.outputs.changed == 'true'
        id: probe
        working-directory: upstream
        env:
          PROBE_SUMMARY: ${{ runner.temp }}/bootstrap-probe.md
        run: |
          set +e
          bash ../.github/scripts/probe_bootstrap.sh 2>&1 | tee "$RUNNER_TEMP/probe.out"
          VERDICT="$(sed -n 's/^VERDICT: //p' "$RUNNER_TEMP/probe.out" | tail -1)"
          [ -f "$PROBE_SUMMARY" ] || echo "Probe produced no summary." > "$PROBE_SUMMARY"
          {
            echo "verdict=${VERDICT:-UNKNOWN}"
            echo 'summary<<EOF'
            cat "$PROBE_SUMMARY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compose PR title and body
        if: steps.bump.outputs.changed == 'true'
        id: pr
        env:
          RELEVANCY: ${{ steps.relevancy.outputs.relevancy }}
          PROBE: ${{ steps.probe.outputs.summary }}
        run: |
          TITLE="[${{ matrix.branch }}] version bump: ${{ steps.bump.outputs.old_id }} -> ${{ steps.bump.outputs.new_id }}"
          if [ "${{ steps.probe.outputs.verdict }}" = "FAIL" ]; then
            TITLE="[upstream-bootstrap] ${TITLE}"
          fi
          {
            echo "Automated zig ${{ matrix.channel }} version bump."
            echo
            echo "- version: ${{ steps.bump.outputs.old_version }} -> ${{ steps.bump.outputs.new_version }}"
            echo "- build_number: ${{ steps.bump.outputs.old_build_number }} -> ${{ steps.bump.outputs.new_build_number }}"
            echo "- tarball: ${{ steps.bump.outputs.tarball_url }}"
            echo "- sha256: ${{ steps.bump.outputs.sha256 }}"
            echo "- bootstrap sha256s patched: ${{ steps.bump.outputs.bootstrap_patched }}"
            echo
            echo "Patch relevancy gate:"
            echo "$RELEVANCY"
            echo
            echo "Bootstrap compatibility probe (pinned zig_impl vs new snapshot):"
            echo "$PROBE"
            echo
            echo "Auto-generated by MementoRC/zig-feedstock's .github/workflows/zig-nightly-snapshot.yml -- verify FAIL/DRIFT/large-OFFSET findings above before merging. Diff is scoped to recipe/recipe.yaml only."
          } > "$RUNNER_TEMP/pr_body.md"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Dry run -- show the would-be PR
        if: steps.bump.outputs.changed == 'true' && inputs.dry_run
        run: |
          {
            echo "### ${{ steps.pr.outputs.title }}"
            echo
            cat "$RUNNER_TEMP/pr_body.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push bump branch to fork and open PR to conda-forge:${{ matrix.branch }}
        if: steps.bump.outputs.changed == 'true' && !inputs.dry_run
        working-directory: upstream
        env:
          GH_TOKEN: ${{ secrets.CF_ZIG_PAT }}
        run: |
          git config user.name "zig-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="snapshot/${{ matrix.branch }}-${{ steps.bump.outputs.new_id }}"
          git checkout -b "$BRANCH"
          git commit -am "zig ${{ matrix.channel }}: bump ${{ steps.bump.outputs.old_id }} -> ${{ steps.bump.outputs.new_id }}"
          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/MementoRC/zig-feedstock.git"
          git push fork "$BRANCH"
          gh pr create \
            --repo conda-forge/zig-feedstock \
            --base "${{ matrix.branch }}" \
            --head "MementoRC:${BRANCH}" \
            --title "${{ steps.pr.outputs.title }}" \
            --body-file "$RUNNER_TEMP/pr_body.md"
